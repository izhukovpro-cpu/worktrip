<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Відрядження</title>
<style>
:root{
  --navy:#1e293b; --green:#10b981; --green-d:#059669; --bg:#f1f5f9; --card:#fff;
  --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --err:#dc2626; --warn:#d97706;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;max-width:100vw;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:16px;-webkit-text-size-adjust:100%}
header{background:var(--navy);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
header h1{margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:.2px}
header h1 span{color:var(--green)}
.tabs{display:flex;gap:4px}
.tab{flex:1;background:none;border:0;color:#cbd5e1;font:inherit;font-size:15px;padding:10px 4px 12px;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{color:#fff;border-bottom-color:var(--green);font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 2px rgba(15,23,42,.06);margin-bottom:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px;font-weight:500}
label:first-child{margin-top:0}
label b{color:var(--err);font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#64748b 50%),linear-gradient(135deg,#64748b 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(16,185,129,.18)}
.row{display:flex;gap:10px}
.row>div{flex:1;min-width:0}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:600;font-size:16px;padding:14px;margin-top:18px;cursor:pointer}
.btn:active{background:var(--green-d)}
.btn[disabled]{opacity:.6}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.photo{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #cbd5e1;border-radius:12px;padding:18px;color:var(--navy);font-weight:600;cursor:pointer;background:#f8fafc}
.photo input{display:none}
.photo.big{flex-direction:column;padding:22px 12px;margin-top:14px;font-size:17px}
.photo small{font-weight:400;color:var(--muted);font-size:13px;margin-top:4px}
.ecard{background:var(--card);border-radius:14px;padding:12px 14px 14px;box-shadow:0 1px 2px rgba(15,23,42,.06);margin-bottom:10px}
.ehead{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.ethumb{width:56px;height:56px;border-radius:8px;background:#e2e8f0;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px;text-decoration:none}
.ethumb img{width:100%;height:100%;object-fit:cover}
.estat{flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.estat.ok{color:#047857}.estat.warn{color:#b45309}.estat.err{color:var(--err)}.estat.ai{color:#7c3aed}
.edel{border:0;background:#f1f5f9;color:var(--navy);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;cursor:pointer;flex:none}
.edel.sure{background:var(--err);color:#fff}
.ecard label{margin-top:8px}
.ecard input,.ecard select{padding:9px 10px}
.ecard input[disabled],.ecard select[disabled]{background:#f8fafc;color:#94a3b8}
.total{background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.total b{color:var(--green)}
.msg{border-radius:12px;padding:14px;margin-bottom:14px;font-size:15px;line-height:1.45}
.msg.ok{background:#ecfdf5;border:1px solid #a7f3d0}
.msg.err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
.msg.warn{background:#fffbeb;border:1px solid #fde68a}
.msg a{color:var(--green-d);font-weight:600}
.trip{border-bottom:1px solid var(--line);padding:12px 0}
.trip:last-child{border-bottom:0}
.trip .t{font-weight:600}
.trip .m{font-size:13px;color:var(--muted);margin-top:3px}
.trip .l{margin-top:6px;font-size:14px}
.trip .l a{color:var(--green-d);margin-right:14px;text-decoration:none;font-weight:600}
.st{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e2e8f0;color:var(--navy);margin-left:6px;font-weight:500}
.st.ok{background:#d1fae5;color:#065f46}.st.err{background:#fee2e2;color:#991b1b}
.hidden{display:none!important}
.center{text-align:center;color:var(--muted);padding:30px 0}
.spin{width:28px;height:28px;border:3px solid #cbd5e1;border-top-color:var(--green);border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
.overlay{position:fixed;inset:0;background:rgba(241,245,249,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;font-weight:500;color:var(--navy)}
</style>
<script>window.TRIPS_API_URL="https://script.google.com/macros/s/AKfycbyTyjqiY4NJD6w6FZOZEDjGIwZN-4PaEQ5_f0DgMP1qaUoWrMg4s0EyDsHOxvrHCVBfOQ/exec";</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1e293b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Відрядження">
<meta name="robots" content="noindex">
</head>
<body>
<header>
  <h1>Відрядження <span>•</span> реєстр</h1>
  <nav class="tabs">
    <button class="tab on" data-tab="trip">Нове</button>
    <button class="tab" data-tab="exp">Чек</button>
    <button class="tab" data-tab="list">Список</button>
  </nav>
</header>

<main>
  <div id="loading" class="center"><div class="spin"></div>Завантаження…</div>

  <section id="pinBox" class="card hidden">
    <label for="pin">PIN-код форми</label>
    <input id="pin" inputmode="numeric" autocomplete="off" placeholder="Введіть PIN">
    <div class="hint">Вводиться один раз на цьому телефоні.</div>
    <button class="btn" id="pinBtn">Увійти</button>
  </section>

  <div id="out"></div>

  <!-- НОВЕ ВІДРЯДЖЕННЯ -->
  <section id="tab-trip" class="hidden">
    <form id="fTrip" class="card" autocomplete="off">
      <label>Працівник <b>*</b></label>
      <select name="employee" id="employee" required></select>
      <label>Компанія <b>*</b></label>
      <select name="company" id="company" required></select>
      <label>Проєкт / об'єкт</label>
      <select name="project" id="project"></select>
      <label>Місце призначення <b>*</b></label>
      <input name="place" id="place" required placeholder="м. Березань, Київська обл.">
      <div class="row">
        <div><label>З <b>*</b></label><input type="date" name="start" id="start" required></div>
        <div><label>По <b>*</b></label><input type="date" name="end" id="end" required></div>
      </div>
      <label>Мета відрядження <b>*</b></label>
      <textarea name="goal" required placeholder="технічний нагляд за монтажем обладнання"></textarea>
      <div class="row">
        <div><label>Добові за добу</label><input name="rate" id="rate" inputmode="decimal" placeholder="700"></div>
        <div><label>Валюта</label><select name="currency" id="currency"></select></div>
      </div>
      <div class="hint">Стандарт компанії підставляється сам (зараз 700 грн). Якщо добові не потрібні — поставте 0.</div>
      <label>Автомобіль</label>
      <select name="car" id="car"></select>
      <div class="hint">«Без автомобіля» — пункт про авто не потрапить у наказ. Нове авто додається в аркуші «Автомобілі».</div>
      <button class="btn" type="submit">Оформити відрядження</button>
    </form>
  </section>

  <!-- ЧЕКИ -->
  <section id="tab-exp" class="hidden">
    <div class="card">
      <label>Відрядження <b>*</b></label>
      <select id="tripId"></select>
      <label class="photo big" for="files">📷 Додати чеки<small>можна кілька фото або PDF одразу</small>
        <input type="file" id="files" accept="image/*,application/pdf" multiple>
      </label>
      <div class="hint" id="aiHint"></div>
    </div>
    <div id="expTotal" class="total hidden"></div>
    <div id="expList"></div>
  </section>

  <!-- СПИСОК -->
  <section id="tab-list" class="hidden">
    <div class="card" id="tripList"></div>
    <button class="btn sec" id="refresh">Оновити</button>
  </section>
</main>

<div id="busy" class="overlay hidden"><div class="spin"></div><div id="busyText">Зачекайте…</div></div>

<script>
// Поза Google (GitHub Pages) замінюємо google.script.run на запити до API скрипта (doPost).
// Запит іде без cookie Google, тому кілька акаунтів у браузері не заважають.
(function () {
  if (window.google && google.script && google.script.run) return;
  var URL = window.TRIPS_API_URL;
  function runner(ok, fail) {
    return new Proxy({}, { get: function (_, name) {
      if (name === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () {
        var args = Array.prototype.slice.call(arguments);
        var err = function (m) { if (fail) fail(new Error(m)); };
        fetch(URL, { method: 'POST', redirect: 'follow', credentials: 'omit',
                     headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                     body: JSON.stringify({ fn: name, args: args }) })
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var d; try { d = JSON.parse(t); } catch (e) { err('Сервер відповів не так, як очікувалось. Спробуйте ще раз.'); return; }
            setTimeout(function () { if (d.ok) { if (ok) ok(d.result); } else err(d.error); }, 0);
          })
          .catch(function () { err('Немає звʼязку з сервером. Перевірте інтернет.'); });
      };
    } });
  }
  window.google = window.google || {};
  google.script = { run: runner(null, null) };
})();

(function () {
  var D = null, PIN = '';
  try { PIN = localStorage.getItem('trip_pin') || ''; } catch (e) {}

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function remember(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function busy(on, text) { $('busyText').textContent = text || 'Зачекайте…'; $('busy').classList.toggle('hidden', !on); }
  function show(html, kind) { $('out').innerHTML = html ? '<div class="msg ' + (kind || 'ok') + '">' + html + '</div>' : ''; if (html) window.scrollTo(0, 0); }

  function call(fn, args, ok) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (err) {
        busy(false);
        var m = (err && err.message) || String(err);
        if (m.indexOf('PIN_REQUIRED') >= 0) { askPin(PIN ? 'Невірний PIN.' : ''); return; }
        show(esc(m.replace(/^Error:\s*/, '')), 'err');
      })[fn].apply(null, args);
  }

  function askPin(msg) {
    $('loading').classList.add('hidden');
    $('pinBox').classList.remove('hidden');
    ['trip', 'exp', 'list'].forEach(function (t) { $('tab-' + t).classList.add('hidden'); });
    show(msg ? esc(msg) : '', 'err');
  }
  $('pinBtn').onclick = function () {
    PIN = $('pin').value.trim(); remember('trip_pin', PIN);
    $('pinBox').classList.add('hidden'); $('loading').classList.remove('hidden'); show('');
    load();
  };

  function opts(sel, items, placeholder, val) {
    var h = placeholder !== null ? '<option value="">' + esc(placeholder || '— оберіть —') + '</option>' : '';
    items.forEach(function (it) {
      var v = typeof it === 'string' ? it : it.value, l = typeof it === 'string' ? it : it.label;
      h += '<option value="' + esc(v) + '"' + (v === val ? ' selected' : '') + '>' + esc(l) + '</option>';
    });
    sel.innerHTML = h;
  }

  function load(cb) {
    call('apiGetData', [PIN], function (data) {
      D = data;
      $('loading').classList.add('hidden');
      var me = '';
      D.employees.forEach(function (e) { if (D.email && e.email && e.email.toLowerCase() === D.email.toLowerCase()) me = e.name; });
      me = me || recall('trip_emp');
      opts($('employee'), D.employees.map(function (e) { return e.name; }), null, me);
      if (!me && D.employees.length) $('employee').insertAdjacentHTML('afterbegin', '<option value="" selected>— оберіть —</option>');
      opts($('company'), D.companies, null, '');
      opts($('project'), D.projects.map(function (p) { return p.name; }), '— без проєкту —', '');
      opts($('currency'), D.currencies, null, recall('trip_cur') || 'UAH');
      opts($('car'), (D.cars || []).map(function (c) { return { value: c.plate, label: c.label }; }), '— без автомобіля —', '');
      aiHint();
      onEmployee();
      fillTrips();
      loadExpenses();
      if (cb) cb();
      if (!document.querySelector('section[id^="tab-"]:not(.hidden)')) openTab(recall('trip_tab') || 'trip');
    });
  }

  function applyRate() {
    var r = D && D.rates ? D.rates[$('company').value] : null;
    if (r && r.rate !== '') { $('rate').value = r.rate; if (r.currency) $('currency').value = r.currency; }
  }
  $('company').onchange = applyRate;

  function onEmployee() {
    var e = null, n = $('employee').value;
    D.employees.forEach(function (x) { if (x.name === n) e = x; });
    if (e && e.company) $('company').value = e.company;
    applyRate();
    var plate = e && e.car ? e.car : '';
    $('car').value = plate;
    if ($('car').value !== plate) $('car').value = '';
  }
  $('employee').onchange = onEmployee;
  $('project').onchange = function () {
    var p = null; D.projects.forEach(function (x) { if (x.name === $('project').value) p = x; });
    if (p && p.address && !$('place').value) $('place').value = p.address;
    if (p && p.company) { $('company').value = p.company; applyRate(); }
  };
  $('start').onchange = function () { if (!$('end').value || $('end').value < $('start').value) $('end').value = $('start').value; };

  function tripLabel(t) {
    return (t.start ? t.start + (t.end && t.end !== t.start ? '–' + t.end.slice(0, 5) : '') + ' · ' : '') +
           (t.employee.split(' ')[0] || '') + ' · ' + (t.project || t.place || t.id) + (t.number ? ' (№' + t.number + ')' : '');
  }

  function fillTrips(selectId) {
    var open = D.trips.filter(function (t) { return t.status !== 'Закрито' && t.status !== 'Помилка'; });
    var keep = selectId || $('tripId').value || recall('exp_trip');
    opts($('tripId'), open.map(function (t) { return { value: t.id, label: tripLabel(t) }; }), '— оберіть відрядження —', keep);
    var h = '';
    D.trips.forEach(function (t) {
      var cls = t.status === 'Помилка' ? 'err' : (t.status && t.status !== 'Нова' ? 'ok' : '');
      h += '<div class="trip"><div class="t">' + esc(t.employee) + '<span class="st ' + cls + '">' + esc(t.status || '—') + '</span></div>' +
           '<div class="m">' + esc([t.start + (t.end ? ' – ' + t.end : ''), t.place, t.project, t.number ? 'наказ № ' + t.number : ''].filter(Boolean).join(' · ')) + '</div>' +
           (t.status === 'Помилка' && t.note ? '<div class="m" style="color:#991b1b">' + esc(t.note) + '</div>' : '') +
           '<div class="l">' + (t.folder ? '<a href="' + esc(t.folder) + '" target="_blank">Папка</a>' : '') +
           (t.pdf ? '<a href="' + esc(t.pdf) + '" target="_blank">Наказ</a>' : '') +
           '<a href="#" data-addexp="' + esc(t.id) + '">+ Чек</a></div></div>';
    });
    $('tripList').innerHTML = h || '<div class="center">Ще немає відряджень</div>';
  }

  $('tripList').onclick = function (ev) {
    var a = ev.target.closest('[data-addexp]');
    if (!a) return;
    ev.preventDefault();
    openTab('exp'); $('tripId').value = a.getAttribute('data-addexp'); remember('exp_trip', $('tripId').value); loadExpenses();
  };

  function openTab(name) {
    remember('trip_tab', name);
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tab') === name); });
    ['trip', 'exp', 'list'].forEach(function (t) { $('tab-' + t).classList.toggle('hidden', t !== name); });
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.onclick = function () { if (!D) return; show(''); openTab(b.getAttribute('data-tab')); };
  });
  $('refresh').onclick = function () { busy(true, 'Оновлюю…'); load(function () { busy(false); }); };

  function formObj(form) {
    var o = {};
    Array.prototype.forEach.call(form.elements, function (el) { if (el.name) o[el.name] = el.value.trim(); });
    return o;
  }

  // ---- нове відрядження
  $('fTrip').onsubmit = function (ev) {
    ev.preventDefault();
    var f = formObj(this);
    if (f.end < f.start) { show('Дата «По» раніше за дату «З».', 'err'); return; }
    remember('trip_emp', f.employee); remember('trip_cur', f.currency);
    busy(true, 'Оформлюю наказ…');
    call('apiCreateTrip', [PIN, f], function (t) {
      busy(false);
      if (t.status === 'Помилка') {
        show('<b>Відрядження збережено, але наказ не сформовано.</b><br>' + esc(t.note) +
             '<br><span class="hint">Виправте дані в таблиці й поставте Статус «Нова».</span>', 'warn');
      } else if (t.number) {
        show('<b>Наказ № ' + esc(t.number) + ' оформлено.</b><br>Бухгалтерія та кадровик отримають його в щоденному листі о 9:00.<br>' +
             (t.folder ? '<a href="' + esc(t.folder) + '" target="_blank">Папка відрядження</a> &nbsp; ' : '') +
             (t.pdf ? '<a href="' + esc(t.pdf) + '" target="_blank">Наказ (PDF)</a>' : ''), 'ok');
      } else {
        show('<b>Відрядження збережено.</b> Наказ буде сформовано протягом кількох хвилин.', 'ok');
      }
      $('fTrip').reset();
      load(function () {
        $('employee').value = f.employee; onEmployee();
        $('currency').value = f.currency;
        if (t.id) { fillTrips(t.id); remember('exp_trip', t.id); }
      });
    });
  };

  // ---- ЧЕКИ: кожне фото одразу зберігається, Gemini заповнює поля
  var cards = [], queue = [], uploading = false, seq = 0;

  function aiHint() {
    $('aiHint').textContent = D && D.gemini
      ? 'Сума, валюта, дата і категорія заповнюються автоматично (Gemini). Перевірте й за потреби виправте.'
      : 'Після додавання фото впишіть суму і категорію — все зберігається автоматично.';
  }

  $('tripId').onchange = function () { remember('exp_trip', this.value); loadExpenses(); };

  function loadExpenses() {
    cards = cards.filter(function (c) { return !c.id && c.status !== 'err'; }); // незавершені завантаження лишаємо
    var tid = $('tripId').value;
    renderCards();
    if (!tid) return;
    call('apiListExpenses', [PIN, tid], function (list) {
      if ($('tripId').value !== tid) return;
      list.reverse().forEach(function (dto) {
        cards.push({ key: 'k' + (++seq), id: dto.id, tripId: tid, dto: dto, status: 'ok', msg: savedMsg(dto), touched: {}, edited: {} });
      });
      renderCards();
    });
  }

  function savedMsg(dto) {
    if (dto.amount === '' || !dto.category) return 'Збережено. Додайте суму і категорію.';
    return '✓ Збережено' + (dto.source === 'Gemini' ? ' · розпізнано Gemini' : '');
  }

  $('files').onchange = function () {
    var tid = $('tripId').value;
    if (!tid) { show('Спочатку оберіть відрядження.', 'err'); this.value = ''; return; }
    show('');
    Array.prototype.forEach.call(this.files, function (file) {
      var c = { key: 'k' + (++seq), id: null, tripId: tid, dto: { amount: '', currency: recall('exp_cur') || 'UAH', category: '', date: D.today, desc: '' },
                status: 'up', msg: 'Обробка фото…', touched: {}, edited: {}, preview: null, data: null, mime: file.type, name: file.name };
      cards.unshift(c);
      prepare(file, c);
    });
    this.value = '';
    renderCards();
  };

  function prepare(file, c) {
    if (/^image\//.test(file.type) && !/gif|svg/.test(file.type)) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 2000, w = img.naturalWidth, hh = img.naturalHeight, k = Math.min(1, max / Math.max(w, hh));
        var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(hh * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        var du = cv.toDataURL('image/jpeg', 0.85);
        c.data = du.split(',')[1]; c.mime = 'image/jpeg'; c.preview = du; c.name = (c.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
        URL.revokeObjectURL(url); enqueue(c);
      };
      img.onerror = function () { readRaw(file, c); };
      img.src = url;
    } else {
      readRaw(file, c);
    }
  }
  function readRaw(file, c) {
    var r = new FileReader();
    r.onload = function () { c.data = String(r.result).split(',')[1]; enqueue(c); };
    r.readAsDataURL(file);
  }

  function enqueue(c) { c.msg = 'Очікує завантаження…'; queue.push(c); renderCard(c); next(); }

  function next() {
    if (uploading || !queue.length) return;
    var c = queue.shift();
    if (c.removed) { next(); return; }
    uploading = true; c.msg = 'Завантажую…'; renderCard(c);
    google.script.run.withSuccessHandler(function (r) {
      uploading = false; c.id = r.id; c.dto.url = r.url; c.data = null;
      if (c.removed) { google.script.run.apiDeleteExpense(PIN, r.id); next(); return; }
      flushTouched(c);
      if (r.gemini) { recognize(c); }
      else { c.status = 'ok'; c.msg = savedMsg(c.dto); }
      renderCard(c); next();
    }).withFailureHandler(function (err) {
      uploading = false; c.status = 'err'; c.msg = 'Не завантажено: ' + errText(err) + ' Натисніть «Повторити».'; renderCard(c); next();
    }).apiAddExpense(PIN, { tripId: c.tripId, file: { name: c.name, mime: c.mime, data: c.data }, currency: c.dto.currency, who: recall('trip_emp') });
  }

  function recognize(c, force) {
    c.status = 'ai'; renderCard(c); setStat(c, 'ai', force ? 'Розпізнаю ще раз…' : 'Збережено ✓ Розпізнаю суму…');
    google.script.run.withSuccessHandler(function (dto) {
      if (!dto || dto.skipped) { c.status = 'ok'; c.msg = savedMsg(c.dto); renderCard(c); return; }
      ['amount', 'currency', 'category', 'date', 'desc'].forEach(function (f) { if (force || (!c.edited[f] && !c.touched[f])) c.dto[f] = dto[f]; });
      if (force) c.edited = {};
      c.dto.source = dto.source;
      if (!dto.found) { c.status = 'warn'; c.msg = 'Gemini не знайшов суму — впишіть вручну.'; }
      else if (dto.note) { c.status = 'warn'; c.msg = '✓ ' + dto.note; }
      else { c.status = 'ok'; c.msg = '✓ Розпізнано Gemini — перевірте суму'; }
      renderCard(c); renderTotal();
    }).withFailureHandler(function (err) {
      c.status = 'warn'; c.msg = 'Не розпізнано: ' + errText(err) + ' Впишіть суму або натисніть ↻.'; renderCard(c);
    }).apiRecognize(PIN, c.id, !!force);
  }

  function errText(err) { return String((err && err.message) || err).replace(/^Error:\s*/, ''); }

  // зміни полів — зберігаються одразу
  var timers = {};
  $('expList').addEventListener('input', onField);
  $('expList').addEventListener('change', onField);
  function onField(ev) {
    var el = ev.target, f = el.getAttribute('data-f'); if (!f) return;
    var c = byKey(el.closest('.ecard').id.slice(2)); if (!c) return;
    c.dto[f] = el.value; c.touched[f] = true; c.edited[f] = true;
    if (f === 'currency') remember('exp_cur', el.value);
    renderTotal();
    if (!c.id) return;                        // збережеться після завантаження
    clearTimeout(timers[c.key]);
    timers[c.key] = setTimeout(function () { save(c); }, ev.type === 'change' ? 50 : 900);
  }
  function flushTouched(c) { if (Object.keys(c.touched).length) save(c); }
  function save(c) {
    var payload = {};
    Object.keys(c.touched).forEach(function (f) { payload[f] = c.dto[f]; });
    setStat(c, '', 'Зберігаю…');
    google.script.run.withSuccessHandler(function (dto) {
      c.touched = {}; c.dto.source = dto ? dto.source : c.dto.source; c.status = 'ok'; setStat(c, 'ok', savedMsg(c.dto));
    }).withFailureHandler(function (err) { setStat(c, 'err', 'Не збережено: ' + errText(err)); })
      .apiUpdateExpense(PIN, c.id, payload);
  }

  $('expList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b || !b.closest('.ecard')) return;
    var c = byKey(b.closest('.ecard').id.slice(2)); if (!c) return;
    if (b.classList.contains('retry')) { c.status = 'up'; enqueue(c); return; }
    if (b.classList.contains('reai')) { recognize(c, true); return; }
    if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Видалити?'; setTimeout(function () { b.classList.remove('sure'); b.textContent = '×'; }, 3000); return; }
    c.removed = true;
    cards = cards.filter(function (x) { return x !== c; });
    renderCards();
    if (c.id) google.script.run.withFailureHandler(function (err) { show('Не вдалося видалити: ' + esc(errText(err)), 'err'); }).apiDeleteExpense(PIN, c.id);
  });

  function byKey(k) { for (var i = 0; i < cards.length; i++) if (cards[i].key === k) return cards[i]; return null; }

  function cardHtml(c) {
    var thumb = c.preview ? '<img src="' + c.preview + '">' : (c.dto.url ? '' : '📄');
    var t = c.dto.url && !c.preview ? '<a class="ethumb" href="' + esc(c.dto.url) + '" target="_blank">🧾</a>' : '<div class="ethumb">' + thumb + '</div>';
    var curOpts = D.currencies.map(function (x) { return '<option' + (x === c.dto.currency ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    var catOpts = '<option value="">— категорія —</option>' + D.categories.map(function (x) { return '<option' + (x === c.dto.category ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');
    return '<div class="ecard" id="e-' + c.key + '">' +
      '<div class="ehead">' + t + '<div class="estat ' + (c.status === 'err' ? 'err' : c.status === 'ai' ? 'ai' : c.status === 'warn' ? 'warn' : c.status === 'ok' ? 'ok' : '') + '">' + esc(c.msg) + '</div>' +
      (c.status === 'err' ? '<button type="button" class="edel retry">Повторити</button>' : '') +
      (c.id && D.gemini && c.status !== 'ai' ? '<button type="button" class="edel reai" title="Розпізнати ще раз">↻</button>' : '') +
      '<button type="button" class="edel">×</button></div>' +
      '<div class="row"><div><label>Сума</label><input data-f="amount" inputmode="decimal" placeholder="0.00" value="' + esc(c.dto.amount) + '"></div>' +
      '<div><label>Валюта</label><select data-f="currency">' + curOpts + '</select></div></div>' +
      '<label>Категорія</label><select data-f="category">' + catOpts + '</select>' +
      '<div class="row"><div><label>Дата</label><input type="date" data-f="date" value="' + esc(c.dto.date) + '"></div>' +
      '<div><label>Коментар</label><input data-f="desc" placeholder="напр. WOG" value="' + esc(c.dto.desc) + '"></div></div></div>';
  }
  function renderCards() {
    var tid = $('tripId').value;
    $('expList').innerHTML = cards.filter(function (c) { return c.tripId === tid; }).map(cardHtml).join('');
    renderTotal();
  }
  function renderCard(c) {
    var el = $('e-' + c.key); if (!el) return;
    var active = document.activeElement && el.contains(document.activeElement) ? document.activeElement.getAttribute('data-f') : null;
    if (active) {                            // не перемальовуємо поле, в якому людина пише
      Array.prototype.forEach.call(el.querySelectorAll('[data-f]'), function (inp) {
        var f = inp.getAttribute('data-f'); if (f !== active && !c.touched[f]) inp.value = c.dto[f] == null ? '' : c.dto[f];
      });
      setStat(c, c.status, c.msg);
      return;
    }
    el.outerHTML = cardHtml(c);
    renderTotal();
  }
  function setStat(c, cls, msg) {
    c.msg = msg; var el = $('e-' + c.key); if (!el) return;
    var s = el.querySelector('.estat'); s.className = 'estat ' + (cls || ''); s.textContent = msg;
  }
  function renderTotal() {
    var tid = $('tripId').value, sums = {}, n = 0;
    cards.forEach(function (c) {
      if (c.tripId !== tid) return; n++;
      var a = parseFloat(String(c.dto.amount).replace(',', '.')); if (isNaN(a)) return;
      sums[c.dto.currency || 'UAH'] = (sums[c.dto.currency || 'UAH'] || 0) + a;
    });
    var parts = Object.keys(sums).map(function (k) { return '<b>' + sums[k].toFixed(2) + ' ' + esc(k) + '</b>'; });
    $('expTotal').classList.toggle('hidden', !n);
    $('expTotal').innerHTML = 'Чеків: <b>' + n + '</b>' + (parts.length ? ' · Разом: ' + parts.join(' + ') : '');
  }

  load();
})();
</script>
